name: Build Summary

on:
  workflow_call:
    inputs:
      push_tag:
        required: true
        type: string
      project_version:
        required: true
        type: string
      s3_prefix:
        required: true
        type: string
      build_images_result:
        required: true
        type: string
      build_helm_result:
        required: true
        type: string
      publish_result:
        required: true
        type: string
      validate_result:
        required: true
        type: string

jobs:
  summary:
    name: Build summary
    runs-on: ubuntu-24.04
    steps:
      - name: Post build summary
        env:
          S3_BUCKET: ${{ vars.THEROCK_BUCKET_NAME }}
        run: |
          {
            echo "## Nightly Build — \`${{ inputs.push_tag }}\`"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Build Images | ${{ inputs.build_images_result }} |"
            echo "| Build Helm | ${{ inputs.build_helm_result }} |"
            echo "| Publish | ${{ inputs.publish_result }} |"
            echo "| Validate | ${{ inputs.validate_result }} |"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Version | \`${{ inputs.project_version }}\` |"
            echo "| Tag | \`${{ inputs.push_tag }}\` |"
            echo "| S3 | \`s3://${S3_BUCKET}/${{ inputs.s3_prefix }}/\` |"
          } >> "$GITHUB_STEP_SUMMARY"
