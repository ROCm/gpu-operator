name: Build Helm Chart

on:
  workflow_call:
    inputs:
      push_tag:
        required: true
        type: string
        description: 'Image tag embedded in the chart (e.g. v0.0.1-20260909)'
      project_version:
        required: true
        type: string
        description: 'Project version from Makefile (e.g. v0.0.1)'

jobs:
  build:
    name: Build Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          load: true
          tags: gpu-operator-build:dev
          cache-from: type=gha,scope=build-env
          cache-to: type=gha,mode=max,scope=build-env

      - name: Build Helm chart inside dev container
        env:
          PUSH_TAG: ${{ inputs.push_tag }}
          PROJECT_VERSION: ${{ inputs.project_version }}
        run: |
          docker run --rm --privileged \
            --network host \
            -e CI=true \
            -e "DOCKER_REGISTRY=docker.io/amdpsdo" \
            -e "IMAGE_NAME=gpu-operator" \
            -e "IMAGE_TAG=${PUSH_TAG}" \
            -e "PROJECT_VERSION=${PROJECT_VERSION}" \
            -e "HELM_CHART_VERSION=${PROJECT_VERSION}" \
            -e "HELM_APP_VERSION=${PUSH_TAG}" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/gpu-operator" \
            -w /gpu-operator \
            gpu-operator-build:dev \
            bash -c "set -euo pipefail && source ~/.bashrc 2>/dev/null || true && git config --global --add safe.directory /gpu-operator && make generate manifests helm-k8s"

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-helm-${{ inputs.push_tag }}
          retention-days: 1
          path: helm-charts-k8s/gpu-operator-helm-k8s-${{ inputs.project_version }}.tgz
