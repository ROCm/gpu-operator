name: Nightly Build

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

concurrency:
  group: gpuop-nightly
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: write

jobs:

  resolve:
    name: Resolve
    runs-on: ubuntu-24.04
    outputs:
      project_version: ${{ steps.resolve.outputs.project_version }}
      push_tag:        ${{ steps.resolve.outputs.push_tag }}
      s3_prefix:       ${{ steps.resolve.outputs.s3_prefix }}
      date:            ${{ steps.resolve.outputs.date }}
      sha:             ${{ steps.resolve.outputs.sha }}
      build_needed:    ${{ steps.dedup.outputs.cache-hit != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve parameters
        id: resolve
        run: |
          set -euo pipefail
          PROJECT_VERSION=$(grep -m1 'PROJECT_VERSION ?=' Makefile | awk '{print $NF}')
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          PUSH_TAG="${PROJECT_VERSION}-${DATE}"
          S3_PREFIX="gpu-operator/nightly/${DATE}"

          echo "project_version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "push_tag=${PUSH_TAG}"               >> "$GITHUB_OUTPUT"
          echo "s3_prefix=${S3_PREFIX}"             >> "$GITHUB_OUTPUT"
          echo "date=${DATE}"                       >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}"                         >> "$GITHUB_OUTPUT"

          echo "Project version : ${PROJECT_VERSION}"
          echo "Push tag        : ${PUSH_TAG}"
          echo "S3 prefix       : ${S3_PREFIX}"
          echo "Date            : ${DATE}"
          echo "SHA             : ${SHA}"

      - name: Check dedup cache
        id: dedup
        if: github.event_name == 'schedule'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          key: dedup-gpuop-${{ steps.resolve.outputs.date }}-${{ steps.resolve.outputs.sha }}
          path: .dedup-marker
          lookup-only: true

      - name: Dedup summary
        if: steps.dedup.outputs.cache-hit == 'true'
        run: |
          {
            echo "## Nightly Build — Skipped"
            echo "Build already succeeded for \`${{ steps.resolve.outputs.push_tag }}\` at SHA \`${{ steps.resolve.outputs.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  build-images:
    name: Build Images
    needs: resolve
    if: needs.resolve.outputs.build_needed == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      push_tag: ${{ needs.resolve.outputs.push_tag }}
      project_version: ${{ needs.resolve.outputs.project_version }}

  build-helm:
    name: Build Helm
    needs: resolve
    if: needs.resolve.outputs.build_needed == 'true'
    uses: ./.github/workflows/build-helm.yml
    with:
      push_tag: ${{ needs.resolve.outputs.push_tag }}
      project_version: ${{ needs.resolve.outputs.project_version }}

  publish:
    name: Publish
    needs: [resolve, build-images, build-helm]
    if: >-
      always()
      && needs.resolve.outputs.build_needed == 'true'
      && needs.build-images.result == 'success'
      && needs.build-helm.result == 'success'
    uses: ./.github/workflows/publish.yml
    with:
      push_tag: ${{ needs.resolve.outputs.push_tag }}
      project_version: ${{ needs.resolve.outputs.project_version }}
      s3_prefix: ${{ needs.resolve.outputs.s3_prefix }}
      dedup_key: dedup-gpuop-${{ needs.resolve.outputs.date }}-${{ needs.resolve.outputs.sha }}
    secrets: inherit

  validate:
    name: Validate
    needs: [resolve, publish]
    if: always() && needs.publish.result == 'success'
    uses: ROCm/common-infra-operator/.github/workflows/rocm-orchestrator.yml@main
    with:
      component: gpu-operator
      scenario: nightly
      s3_prefix: ${{ needs.resolve.outputs.s3_prefix }}

  results:
    name: Summary
    needs: [resolve, build-images, build-helm, publish, validate]
    if: always() && needs.resolve.outputs.build_needed == 'true'
    uses: ./.github/workflows/build-summary.yml
    with:
      push_tag: ${{ needs.resolve.outputs.push_tag }}
      project_version: ${{ needs.resolve.outputs.project_version }}
      s3_prefix: ${{ needs.resolve.outputs.s3_prefix }}
      build_images_result: ${{ needs.build-images.result }}
      build_helm_result: ${{ needs.build-helm.result }}
      publish_result: ${{ needs.publish.result }}
      validate_result: ${{ needs.validate.result }}
