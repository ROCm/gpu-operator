name: Publish

on:
  workflow_call:
    inputs:
      push_tag:
        required: true
        type: string
        description: 'Artifact tag for rename and push (e.g. v0.0.1-20260909)'
      project_version:
        required: true
        type: string
        description: 'Project version from Makefile (e.g. v0.0.1)'
      s3_prefix:
        required: true
        type: string
        description: 'S3 key prefix (e.g. gpu-operator/nightly/20260909)'
      dedup_key:
        required: false
        type: string
        default: ''
        description: 'Cache key for dedup marker (saved on success)'
    outputs:
      s3_result:
        description: 'S3 upload outcome'
        value: ${{ jobs.publish.outputs.s3_result }}
      registry_result:
        description: 'DockerHub push outcome'
        value: ${{ jobs.publish.outputs.registry_result }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      s3_result: ${{ steps.s3-upload.outcome }}
      registry_result: ${{ steps.registry-push.outcome }}
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-images-${{ inputs.push_tag }}
          path: artifacts

      - name: Download Helm artifact
        uses: actions/download-artifact@v4
        with:
          name: build-helm-${{ inputs.push_tag }}
          path: artifacts

      - name: Rename artifacts
        env:
          PUSH_TAG: ${{ inputs.push_tag }}
          PROJECT_VERSION: ${{ inputs.project_version }}
        run: |
          set -euo pipefail
          cd artifacts
          mv gpu-operator.tar.gz "gpu-operator-${PUSH_TAG}.tar.gz"
          mv gpu-operator-utils.tar.gz "gpu-operator-utils-${PUSH_TAG}.tar.gz"
          mv gpu-operator-olm-bundle.tar.gz "gpu-operator-olm-bundle-${PUSH_TAG}.tar.gz"
          mv "gpu-operator-helm-k8s-${PROJECT_VERSION}.tgz" "gpu-operator-helm-k8s-${PUSH_TAG}.tgz"
          echo "Renamed artifacts:"
          ls -la

      - name: Validate upload prerequisites
        env:
          HAS_ARN: ${{ secrets.ROCK_CI_S3_SECRET != '' }}
          S3_BUCKET: ${{ vars.THEROCK_BUCKET_NAME }}
        run: |
          if [ "${HAS_ARN}" != "true" ]; then
            echo "::error::ROCK_CI_S3_SECRET secret is not set"
            exit 1
          fi
          if [ -z "${S3_BUCKET}" ]; then
            echo "::error::THEROCK_BUCKET_NAME variable is not set"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROCK_CI_S3_SECRET }}
          aws-region: us-east-1

      - name: Upload artifacts to S3
        id: s3-upload
        env:
          S3_BUCKET: ${{ vars.THEROCK_BUCKET_NAME }}
          S3_PREFIX: ${{ inputs.s3_prefix }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in artifacts/*; do
            echo "Uploading: $(basename "${f}") → s3://${S3_BUCKET}/${S3_PREFIX}/$(basename "${f}")"
            aws s3 cp "${f}" "s3://${S3_BUCKET}/${S3_PREFIX}/$(basename "${f}")" --no-progress
          done
          shopt -u nullglob
          echo "ok" | aws s3 cp - "s3://${S3_BUCKET}/${S3_PREFIX}/.build-ok" --no-progress
          echo "All artifacts uploaded to s3://${S3_BUCKET}/${S3_PREFIX}/"
          aws s3 ls "s3://${S3_BUCKET}/${S3_PREFIX}/" --human-readable || true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push images to DockerHub
        id: registry-push
        env:
          PUSH_TAG: ${{ inputs.push_tag }}
        run: |
          set -euo pipefail
          push_image() {
            local tarball="$1" image="$2"
            docker load < "${tarball}"
            docker push "${image}"
            echo "Pushed ${image}"
          }
          push_image "artifacts/gpu-operator-${PUSH_TAG}.tar.gz" \
                     "docker.io/amdpsdo/gpu-operator:${PUSH_TAG}"
          push_image "artifacts/gpu-operator-utils-${PUSH_TAG}.tar.gz" \
                     "docker.io/amdpsdo/gpu-operator-utils:${PUSH_TAG}"
          push_image "artifacts/gpu-operator-olm-bundle-${PUSH_TAG}.tar.gz" \
                     "docker.io/amdpsdo/gpu-operator-bundle:${PUSH_TAG}"

      - name: Save dedup marker
        if: inputs.dedup_key != '' && steps.s3-upload.outcome == 'success' && steps.registry-push.outcome == 'success'
        run: mkdir -p .dedup-marker && echo "ok" > .dedup-marker/ok
      - name: Save dedup cache
        if: inputs.dedup_key != '' && steps.s3-upload.outcome == 'success' && steps.registry-push.outcome == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          key: ${{ inputs.dedup_key }}
          path: .dedup-marker
