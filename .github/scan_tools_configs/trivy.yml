# trivy configuration
# Reference: https://trivy.dev/latest/docs/references/configuration/config-file/
# Local scan: trivy fs --config .github/scan_tools_configs/trivy.yml .
#
# Trivy configuration for this repository's security scans.
# This file defines the complete scanner policy; keep repository-specific
# suppressions and tuning here.
#
# Suppressions live in three places, because no single one of them can say
# "this check, on this file":
#
#   .trivyignore          per check, repository-wide. The shared scan workflow
#                         discovers it at the repo root and passes it to trivy
#                         as --ignorefile. Setting `ignorefile:` here instead
#                         does NOT work: trivy resolves that against its own
#                         working directory, which is the directory above the
#                         scanned checkout.
#   inline comments       per check, per line, Dockerfiles only. The Dockerfile
#                         scanner sets `WithSupportsInlineIgnore`; the
#                         Kubernetes scanner does not.
#   skip-files, below     per file, every check.
#
# So a finding that is intrinsic everywhere goes in .trivyignore; one that is
# intrinsic to a particular manifest, or lives in a generated / third-party /
# test-only file, takes skip-files and loses every other check on that file.
# Scoping a single check to a single path (keeping the file's other checks
# live) needs trivy's `.trivyignore.yaml` format, which the shared workflow
# does not yet discover.
scan:
  # Environment and generated-output exclusions support local scans; these
  # paths are absent from clean CI checkouts. `vendor` is the exception: it is
  # committed, and it is third-party Go whose embedded test manifests are not
  # this repository's to fix.
  skip-dirs:
    - .git
    - .venv*
    - venv*
    - build
    - dist
    - node_modules
    - __pycache__
    - vendor

  skip-files:
    # Packaged Helm chart archives. These .tgz are build outputs (regenerated
    # by `make helm`); their contents duplicate the chart sources scanned under
    # helm-charts-k8s/, and they bundle the upstream node-feature-discovery
    # subchart whose leader-election RBAC is the source of the CRITICAL
    # KSV-0045 / KSV-0050 / KSV-0112 findings.
    - helm-charts-openshift/**/*.tgz

    # e2e test input fixtures: copies of the operator Helm charts plus NPD
    # manifests used only to drive the e2e suite. Not shipped artifacts; the
    # chart sources they copy are scanned under helm-charts-k8s/.
    - tests/e2e/yamls/**

    # Generated operator RBAC. These ClusterRoles are produced from
    # +kubebuilder:rbac markers (`make manifests`) and are not hand-edited.
    # KSV-0056 (manage networking) is required for the operator to function;
    # KSV-0041 (manage secrets) is handled repository-wide in .trivyignore.
    # (The KMM and NFD subchart RBAC these render are suppressed in
    # .trivyignore, since trivy's skip-files cannot target Helm subcharts.)
    - config/rbac/role.yaml
    - hack/kmmConfig/rbac/role.yaml
    - hack/kmmConfig/rbac-hub/role.yaml
    - helm-charts-k8s/templates/manager-rbac.yaml

    # Kustomize patch fragments, not deployable manifests. Trivy scans each as
    # a standalone pod spec and reports KSV-0118 (default security context) on
    # the partial container they define; the rendered Deployment that kustomize
    # produces carries a complete securityContext and is scanned via the Helm
    # chart templates, which pass.
    - config/manager-base/manager_config_patch.yaml
    - hack/kmmConfig/manager-base/manager_config_patch.yaml
    - hack/kmmConfig/manager/manager_worker_image_patch.yaml
    - hack/kmmConfig/webhook-server/deployment.yaml

    # Example workloads. Demonstration manifests for running GPU jobs; they are
    # privileged GPU workloads by nature (KSV-0014 / KSV-0017 / KSV-0121 are
    # handled repository-wide in .trivyignore) and the remaining KSV-0053 /
    # KSV-0109 / KSV-0118 findings are intrinsic to the example they teach.
    - example/**
